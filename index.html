<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミノ・ブリーダー - Optimized</title>
    <style>
        :root { --main-gold: #ffd700; --main-cyan: #00ffcc; --main-red: #ff4444; }
        body { 
            background-color: #1a1a1a; color: white; font-family: sans-serif; margin: 0; padding: 5px; 
            overflow: hidden; /* スクロール防止 */
        }
        #game-screen { display: flex; gap: 10px; max-width: 1000px; margin: 0 auto; justify-content: center; height: 98vh; align-items: center; }
        
        /* 全体的にサイズをコンパクトに */
        .left-area { width: 350px; display: flex; flex-direction: column; gap: 8px; transform: scale(0.9); }
        .manual { background: rgba(0, 0, 0, 0.7); padding: 8px; border-radius: 5px; font-size: 11px; border: 1px solid #555; }
        .manual ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .full-row { grid-column: span 2; border-top: 1px solid #444; padding-top: 4px; text-align: center; white-space: nowrap; }

        .main-panel { background: rgba(50, 50, 50, 0.8); border-radius: 8px; padding: 10px; border: 1px solid #666; }
        .info-box { background: #000; padding: 8px; border-radius: 5px; font-size: 13px; border-left: 4px solid var(--main-gold); margin-bottom: 8px; }
        
        .stat-row { margin-bottom: 4px; font-size: 10px; }
        .stat-bar { background: #333; height: 6px; width: 100%; border-radius: 3px; border: 1px solid #444; }
        .stat-fill { background: var(--main-cyan); height: 100%; width: 0%; transition: width 0.3s; }
        
        .btn-group { display: flex; flex-direction: column; gap: 4px; }
        button { padding: 6px; cursor: pointer; border: none; border-radius: 4px; background: #444; color: white; font-size: 10px; text-align: left; }
        button:hover { background: #555; }
        .cost-tag { float: right; color: #ff8888; }
        
        .start-btn { background: var(--main-gold); color: #000; width: 100%; height: 40px; margin-top: 10px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; }

        .right-area { width: 260px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        #stage { border: 2px solid #555; background: rgba(0,0,0,0.9); width: 220px; height: auto; max-height: 70vh; }
        #controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; width: 200px; }
        .ctrl-btn { height: 45px; background: #333; border: 1px solid #555; color: white; font-size: 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        #ranking-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 20px; border-radius: 10px; border: 2px solid var(--main-gold); display: none; z-index: 200; width: 280px; }
        #game-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); color: var(--main-gold); font-size: 30px; font-weight: bold; display: none; z-index: 100; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

<div id="game-msg">パズル完了！</div>

<div id="game-screen">
    <div class="left-area">
        <div class="manual">
            <b>【操作】ミノを10個積もう</b>
            <ul>
                <li><span style="color:var(--main-red)">■</span> 下まで落ちる</li>
                <li><span style="color:var(--main-cyan)">■</span> 空中で固定</li>
                <li><span style="color:var(--main-gold)">■</span> 得点2倍</li>
                <li><span>●</span> 周囲爆破</li>
                <li class="full-row">横一列 <b>300点</b> ／ ↓長押し: 高速落下＋加点</li>
            </ul>
        </div>
        <div class="main-panel">
            <div class="info-box">
                HP: <span id="hp">120</span> | ターン: <span id="turns">10</span>
                <span style="float:right; color:var(--main-gold)">BEST: <span id="high-score">0</span></span>
            </div>
            <div class="btn-group">
                <button onclick="train('A', 10)">バンプアップ (数++) <span class="cost-tag">HP-10</span></button>
                <button onclick="train('B', 10)">筋トレ (固さ++) <span class="cost-tag">HP-10</span></button>
                <button onclick="train('C', 10)">お気楽思想 (ｼﾝﾌﾟﾙ++) <span class="cost-tag">HP-10</span></button>
                <button onclick="train('G', 15)">ダイエット (落下猶予++) <span class="cost-tag">HP-15</span></button>
                <button onclick="train('I', 20)">めいそう (得点UP+) <span class="cost-tag">HP-20</span></button>
                <button onclick="train('F', 30)">錬金術 (金/爆弾+) <span class="cost-tag">HP-30</span></button>
                <button onclick="train('REST', 0)" style="background:#2e7d32;">休憩 (HP+60) <span class="cost-tag" style="color:white">残り1回</span></button>
            </div>
            <div style="margin-top:10px">
                <div class="stat-row">数: <span id="val-a">4.0</span> <div class="stat-bar"><div id="bar-a" class="stat-fill"></div></div></div>
                <div class="stat-row">得点UP: <span id="val-d">0.0</span> <div class="stat-bar"><div id="bar-d" class="stat-fill" style="background:var(--main-gold)"></div></div></div>
            </div>
            <button id="start-btn" class="start-btn" onclick="finishBreeding()">育成完了：パズル開始</button>
        </div>
    </div>

    <div class="right-area">
        <div id="mino-count-display" style="font-size:12px; margin-bottom:5px;">NEXT: 0 / 10</div>
        <canvas id="stage" width="300" height="750"></canvas>
        <div id="controls">
            <div class="ctrl-btn" onmousedown="handleMove(-1,0)">←</div>
            <div class="ctrl-btn" onmousedown="handleRotate()" style="color:var(--main-cyan)">↻</div>
            <div class="ctrl-btn" onmousedown="handleMove(1,0)">→</div>
            <div class="ctrl-btn" style="grid-column: 2;" onmousedown="startRapidDrop()" onmouseup="stopRapidDrop()" onmouseleave="stopRapidDrop()">↓</div>
        </div>
    </div>
</div>

<div id="ranking-area">
    <h4 style="margin: 0 0 10px 0; color: var(--main-gold); text-align: center;">本日のランキング</h4>
    <div id="ranking-list" style="font-size: 14px; line-height: 1.6;"></div>
    <button onclick="location.reload()" style="width:100%; margin-top:15px; padding:10px; background:var(--main-gold); border:none; font-weight:bold;">リトライ</button>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyDkQuswbQDk6-cCgKDhUzZ6eL4WqHQ4lfnhOjc_A_pQ29tGzBBHvIUXx5u2VylU3HCWg/exec";
const COLS = 20, ROWS = 50, SIZE = 15;
let stats = { a: 4.0, b: 2.0, c: 4.0, d: 0.0, e: 0.0, g: 1.0 };
let hp = 120, turns = 10, minoRemaining = 10, minoCount = 0, score = 0, isGameOver = false;
let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
let currentPiece = null, dropIntervalId = null, scoreIntervalId = null;

function train(type, cost) {
    if (turns <= 0) return;
    if (type !== 'REST' && hp < cost) {
        alert("HPが足りません！休憩するか他のトレーニングを選んでください。");
        return;
    }

    if(type === 'A') { stats.a += 1.5; stats.e += 0.1; hp -= cost; }
    if(type === 'B') { stats.b += 1.5; hp -= cost; }
    if(type === 'C') { stats.c += 1.5; hp -= cost; }
    if(type === 'G') { stats.g += 0.5; hp -= cost; }
    if(type === 'I') { stats.d += 0.8; hp -= cost; }
    if(type === 'F') { stats.d += 1.2; stats.e += 1.2; hp -= cost; }
    if(type === 'REST') { hp = Math.min(120, hp + 60); }

    turns--; 
    updateUI();
}

function updateUI() {
    document.getElementById('hp').innerText = Math.floor(hp);
    document.getElementById('turns').innerText = turns;
    document.getElementById('val-a').innerText = stats.a.toFixed(1);
    document.getElementById('val-d').innerText = stats.d.toFixed(1);
    document.getElementById('bar-a').style.width = Math.min(100, (stats.a/20)*100) + "%";
    document.getElementById('bar-d').style.width = Math.min(100, (stats.d/10)*100) + "%";
}

function generateBlockData() {
    let blocks = [{x: 0, y: 0, type: "soft"}];
    for(let i=1; i < Math.floor(stats.a); i++) {
        let b = blocks[Math.floor(Math.random()*blocks.length)];
        let dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].sort(()=>Math.random()-0.5);
        for(let d of dirs) {
            let nx = b.x + d.x, ny = b.y + d.y;
            if (!blocks.some(blo => blo.x === nx && blo.y === ny)) { blocks.push({ x: nx, y: ny, type: "soft" }); break; }
        }
    }
    // 属性付与
    let idx = [...Array(blocks.length).keys()].sort(()=>Math.random()-0.5);
    for(let i=0; i<Math.floor(stats.e) && i<idx.length; i++) blocks[idx[i]].type = "bomb";
    for(let i=0; i<Math.floor(stats.d) && i<idx.length; i++) if(blocks[idx[i]].type==="soft") blocks[idx[i]].type = "gold";
    for(let i=0; i<Math.floor(stats.b) && i<idx.length; i++) if(blocks[idx[i]].type==="soft") blocks[idx[i]].type = "hard";
    return blocks;
}

function finishBreeding() {
    document.querySelectorAll('.btn-group button').forEach(b => b.disabled = true);
    document.getElementById('start-btn').style.display = 'none';
    spawnPiece();
    requestAnimationFrame(gameLoop);
}

function spawnPiece() {
    if (minoRemaining <= 0) { endGame(); return; }
    minoCount++;
    document.getElementById('mino-count-display').innerText = `NEXT: ${minoCount} / 10`;
    currentPiece = { x: Math.floor(COLS/2), y: 2, blocks: generateBlockData() };
    if (checkCollision()) endGame();
    minoRemaining--;
}

function lockPiece() {
    currentPiece.blocks.forEach(b => {
        let nx = currentPiece.x + b.x, ny = currentPiece.y + b.y;
        if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
            grid[ny][nx] = { type: b.type };
            if (b.type === "bomb") explode(nx, ny);
        }
    });
    applyGravity();
    calculateScore();
    spawnPiece();
    stopRapidDrop();
}

function explode(cx, cy) {
    for(let y = cy-1; y <= cy+1; y++) {
        for(let x = cx-1; x <= cx+1; x++) {
            if(y >= 0 && y < ROWS && x >= 0 && x < COLS) grid[y][x] = null;
        }
    }
}

function applyGravity() {
    let moved = true;
    while(moved) {
        moved = false;
        for (let y = ROWS - 2; y >= 0; y--) {
            for (let x = 0; x < COLS; x++) {
                if (grid[y][x] && (grid[y][x].type === "soft" || grid[y][x].type === "gold") && !grid[y+1][x]) {
                    grid[y+1][x] = grid[y][x];
                    grid[y][x] = null;
                    moved = true;
                }
            }
        }
    }
}

function calculateScore() {
    grid.forEach((row, y) => {
        if(row.filter(b => b).length === COLS) {
            score += 300;
            grid[y].fill(null); // 消去
        }
    });
    let currentBlocks = 0;
    grid.forEach((row, y) => row.forEach(b => { if(b) currentBlocks += (b.type === "gold" ? (ROWS-y)*2 : (ROWS-y)); }));
    score += currentBlocks;
}

function gameLoop(time) {
    if (isGameOver) return;
    if (time - (window.lastT || 0) > 500 * stats.g) { move(0, 1); window.lastT = time; }
    draw();
    requestAnimationFrame(gameLoop);
}

function draw() {
    const ctx = document.getElementById('stage').getContext('2d');
    ctx.clearRect(0,0,300,750);
    // スコア背景表示
    ctx.fillStyle = "rgba(255,215,0,0.15)";
    ctx.font = "bold 50px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(Math.floor(score), 150, 375);

    grid.forEach((row, y) => row.forEach((cell, x) => { if(cell) drawSq(ctx, x, y, cell.type); }));
    if(currentPiece) currentPiece.blocks.forEach(b => drawSq(ctx, currentPiece.x + b.x, currentPiece.y + b.y, b.type));
}

function drawSq(ctx, x, y, type) {
    const colors = { hard: "#00ffcc", soft: "#ff4444", gold: "#ffd700", bomb: "#000" };
    ctx.fillStyle = colors[type];
    ctx.fillRect(x*SIZE, y*SIZE, SIZE-1, SIZE-1);
    if(type === 'bomb') { ctx.strokeStyle="red"; ctx.strokeRect(x*SIZE, y*SIZE, SIZE-1, SIZE-1); }
}

function move(dx, dy) {
    currentPiece.x += dx; currentPiece.y += dy;
    if(checkCollision()){
        currentPiece.x -= dx; currentPiece.y -= dy;
        if(dy > 0) lockPiece();
        return false;
    }
    return true;
}

function checkCollision() {
    return currentPiece.blocks.some(b => {
        let nx = currentPiece.x + b.x, ny = currentPiece.y + b.y;
        return nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && grid[ny][nx]);
    });
}

function handleRotate() {
    const old = currentPiece.blocks;
    currentPiece.blocks = currentPiece.blocks.map(b => ({ x: -b.y, y: b.x, type: b.type }));
    if(checkCollision()) currentPiece.blocks = old;
}

function handleMove(dx, dy) { move(dx, dy); draw(); }

function startRapidDrop() {
    if(dropIntervalId) return;
    dropIntervalId = setInterval(() => { move(0,1); draw(); }, 50);
    scoreIntervalId = setInterval(() => { score += 5; }, 100);
}
function stopRapidDrop() { clearInterval(dropIntervalId); clearInterval(scoreIntervalId); dropIntervalId = null; scoreIntervalId = null; }

function endGame() {
    isGameOver = true;
    document.getElementById('game-msg').style.display = 'block';
    setTimeout(() => {
        const name = prompt(`スコア: ${Math.floor(score)}\n名前を入力してください`, "ななし");
        if(name) submitScore(name, Math.floor(score));
        else location.reload();
    }, 500);
}

async function submitScore(name, s) {
    const list = document.getElementById('ranking-list');
    document.getElementById('ranking-area').style.display = 'block';
    list.innerHTML = "読み込み中...";
    try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ name: name, score: s }) });
        const data = await res.json();
        // NaNを排除し、数値であるものだけ表示
        list.innerHTML = data
            .filter(e => !isNaN(e.score) && e.name !== "NaN")
            .slice(0, 5)
            .map((e, i) => `<div>${i+1}位: ${e.name} - ${Math.floor(e.score)}点</div>`)
            .join('');
    } catch(e) { list.innerText = "通信エラー"; }
}

updateUI();
</script>
</body>
</html>
